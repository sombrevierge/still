[package]
name = "still-session-lens"
version = "0.4.6"
description = "A proactive Windows session optimizer and recoverable storage assistant"
authors = ["Catherine"]
edition = "2021"

[lib]
name = "session_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30.13"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
